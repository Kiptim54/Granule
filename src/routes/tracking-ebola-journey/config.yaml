# Country codes used in `highlight` are WB_A3 (ISO 3166-1 alpha-3 with World
# Bank conventions). Full list: see COUNTRY_CODES.md at the repo root.

name: "MapLibre Rig Sub Saharan Africa IBP"
shortcode: "maplibre_rig_ebola"
description: "Map Scrolly for IBP "
version: "1.0.0"
defaultLanguage: en

theme:
  defaultHighlightColor: "#FFFFFF"

# Per-label anchor/offset defaults so a label can be referenced by name in
# multiple steps without repeating its placement. Override per-step if needed.
labelDefaults:
  Kenya:
    anchor: center
    offset: [0, 0]

steps:
  # Step 0 — intro. No title/text means no overlay box is rendered;
  # the globe just sits in view while the user starts scrolling.
  - center: [21.27, 2.71]
    zoom: 2.05
    showCounties: false
    mobile:
      center: [20.10, -1.17]
      zoom: 2.05
    pitch: 0.0
    bearing: 0.0
    hideLabels: true
    highlight: []
    labels: []

  - title: Deaths reported
    text: >
      More than **4,000** people have died from **Ebola in DR Congo** this year, in what is the second most deadly known outbreak to date.
      Kenya recently reported its first Ebola case when a Kenyan businessman was able to spend time in one of the regions worst-affected by Ebola, then travel to two more countries before his illness was identified.

      <br><br>
      A BBC news <a style="color:darkred; font-weight:bold" href="https://www.bbc.com/news/articles/cqp8gknl1njjo" target="_blank">article</a> provides the clearest picture yet of how the businessman travelled thousands of kilometres while growing increasingly unwell.

    center: [25.04, -3.57]
    zoom: 4.72
    pitch: 0.0
    bearing: 0.0
    showCounties: false
    showProvinces: true
    showCountyBorders: true
    countyChoropleth: deaths
    legend:
      type: gradient
      title: "Documented deaths by province"
      stops:
        - value: 0
          color: "#fff5f0"
          label: "0"

        - value: 500
          color: "#de2d26"
          label: "500"
        - value: 2000
          color: "#a50f15"
          label: "2,000"
        - value: 2500
          color: "#67000d"
          label: "2,500"
    highlight: [DRC, UGA, KEN]
    mobile:
      center: [24.23, -1.17]
      zoom: 4.62

    labels:
      - name: Kenya
        lng: 37.91
        lat: -0.02
        marker: false
      - name: DR Congo
        lng: 23.65
        lat: -2.50
        marker: false
      - name: Uganda
        lng: 32.29
        lat: 1.37
        marker: false

  # Step 1 — Sub-Saharan Africa country highlight.
  - title: First case of ebola reported
    text: >


      The man had spent much of late August and early September in the province of Lower Uélé, visiting towns including **Buta,Aketi and Likati**.       <br/> <br/> 

      His **symptoms first emerged around 15 September**. He was given antibiotics and sent home. Two days later, he was admitted to the Tongo Etandi Health Centre in Bondo, where he remained until 19 September after being diagnosed with a skin infection.

