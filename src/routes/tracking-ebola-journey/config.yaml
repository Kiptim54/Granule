  # Step 1 — Sub-Saharan Africa country highlight.
  - title: flying
    text: >
      On 20 September, **he flew to Kisangani**, a city with a population of about 1.5 million people on the Congo River, where he spent more than 10 days seeking medical care.
       <br> <br>
       On 1 October, more than two weeks after first becoming ill, **the businessman boarded another domestic flight to Beni**, before continuing his journey to Kasindi, a busy border town,  **crossing into Uganda** later that day.

