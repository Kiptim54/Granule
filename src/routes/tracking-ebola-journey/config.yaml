# Country codes used in `highlight` are WB_A3 (ISO 3166-1 alpha-3 with World
# Bank conventions). Full list: see COUNTRY_CODES.md at the repo root.

name: "MapLibre Rig Sub Saharan Africa IBP"
shortcode: "maplibre_rig_ebola"
description: "Map Scrolly for IBP "
version: "1.0.0"
defaultLanguage: en

theme:
  defaultHighlightColor: "#FFFFFF"

# Per-label anchor/offset defaults so a label can be referenced by name in
# multiple steps without repeating its placement. Override per-step if needed.
labelDefaults:
  Kenya:
    anchor: center
    offset: [0, 0]

steps:
  # Step 0 — intro. No title/text means no overlay box is rendered;
  # the globe just sits in view while the user starts scrolling.
  - center: [21.27, 2.71]
    zoom: 2.05
    showCounties: false
    mobile:
      center: [20.10, -1.17]
      zoom: 2.05
    pitch: 0.0
    bearing: 0.0
    hideLabels: true
    highlight: []
    labels: []

  # Step 1 — Sub-Saharan Africa country highlight.
  - title: East Africa Intro
    text: >
      More than **4,000** people have died from Ebola in DR Congo this year, in what is the second most deadly known outbreak to date.

    center: [28.05, 1.93]
    zoom: 6.08
    pitch: 0.0
    bearing: 0.0
    showCounties: false
    mobile:
      center: [28.05, 1.93]
      zoom: 5.50
    hideLabels: true
    highlight: [DRC, UGA, KEN]
    labels:
      # - name: Butembo
      #   lng: 29.29
      #   lat: 0.12
      # - name: Mangina
      #   lng: 29.78
      #   lat: 0.95
      # - name: Goma
      #   lng: 29.22
      #   lat: -1.68
      - name: Buta
        number: 1
        transportToNext: road
        lng: 24.7287
        lat: 2.7933
      - name: Ateki
        number: 2
        transportToNext: road
        lng: 23.7791
        lat: 2.7359
      - name: Likati
        number: 3
        transportToNext: road
        lng: 23.5333
        lat: 3.3667
      # - name: Malalise
      #   number: 4
      #   transportToNext: road
      #   lng: 24.01
      #   lat: 3.40 # Approximate position based on the supplied map image.
      - name: Bondo
        number: 5
        transportToNext: flight
        lng: 23.6887
        lat: 3.8130
      - name: Kisangani
        number: 6
        transportToNext: flight
        lng: 25.2057
        lat: 0.5184
      - name: Beni
        number: 7
        transportToNext: road
        lng: 29.47
        lat: 0.49
      - name: Kasindi (DRC) or Mpondwe (UGA)
        number: 8
        transportToNext: car
        lng: 29.6868
        lat: 0.0479
      # - name: Kampala
      #   number: 9
      #   lng: 32.5825
      #   lat: 0.3476

